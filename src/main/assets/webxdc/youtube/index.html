<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <script src="webxdc.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #eee;
      font-family: sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #video {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #000;
    }
    #bar {
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111;
    }
    #title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }
    #status {
      font-size: 12px;
      color: #aaa;
    }
    button {
      background: #333;
      color: #eee;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
    }
    #invite {
      display: none;
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    #invite button {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" controls playsinline></video>
    <div id="bar">
      <span id="title">YouTube Player</span>
      <span id="status"></span>
    </div>
    <div id="invite"></div>
  </div>
  <script src="player.js"></script>
</body>
</html>
